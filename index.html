<title>Tangerine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
/* Layout: single-column app shell, bottom nav, scrollable main area */
:root {
  --bg: #0D0D0F;
  --bg-card: #1A1A1F;
  --bg-card-hover: #222228;
  --bg-elevated: #26262D;
  --fg: #F0EDE8;
  --fg-dim: #8A8690;
  --fg-muted: #5C5960;
  --accent: #FF8C42;
  --accent-glow: rgba(255,140,66,0.15);
  --accent-soft: #FFB380;
  --success: #5CD679;
  --warning: #FFD966;
  --danger: #FF6B6B;
  --mood-great: #5CD679;
  --mood-good: #A8E06C;
  --mood-okay: #FFD966;
  --mood-bad: #FF9F43;
  --mood-awful: #FF6B6B;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-pill: 50px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --safe-left: max(16px, env(safe-area-inset-left, 0px));
  --safe-right: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #FAF8F5;
    --bg-card: #FFFFFF;
    --bg-card-hover: #F5F3F0;
    --bg-elevated: #EDEBE8;
    --fg: #1A1A1F;
    --fg-dim: #6B6770;
    --fg-muted: #A09CA5;
    --accent: #E07830;
    --accent-glow: rgba(224,120,48,0.10);
    --accent-soft: #C06020;
    --success: #3AAF55;
    --warning: #D4A830;
    --danger: #D94444;
    --mood-great: #3AAF55;
    --mood-good: #7BBF40;
    --mood-okay: #D4A830;
    --mood-bad: #D47A20;
    --mood-awful: #D94444;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #FAF8F5;
  --bg-card: #FFFFFF;
  --bg-card-hover: #F5F3F0;
  --bg-elevated: #EDEBE8;
  --fg: #1A1A1F;
  --fg-dim: #6B6770;
  --fg-muted: #A09CA5;
  --accent: #E07830;
  --accent-glow: rgba(224,120,48,0.10);
  --accent-soft: #C06020;
  --success: #3AAF55;
  --warning: #D4A830;
  --danger: #D94444;
  --mood-great: #3AAF55;
  --mood-good: #7BBF40;
  --mood-okay: #D4A830;
  --mood-bad: #D47A20;
  --mood-awful: #D94444;
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  height: 100%;
  overflow: hidden;
  padding-left: var(--safe-left);
  padding-right: var(--safe-right);
}
html { height: 100%; }

body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
}

/* Header */
.header {
  padding: 16px 4px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
}
.header-title {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--accent);
}
.header-date {
  font-size: 0.82rem;
  color: var(--fg-dim);
  font-weight: 500;
}
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  border: none;
  background: var(--bg-card);
  color: var(--fg-dim);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  transition: all 0.2s;
}
.icon-btn:hover { background: var(--bg-card-hover); color: var(--fg); }

/* Main scroll area */
.main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-block: 8px 100px;
  scroll-behavior: smooth;
}
.main::-webkit-scrollbar { width: 0; }

/* Date strip */
.date-strip {
  display: flex;
  gap: 6px;
  padding: 8px 4px 16px;
  overflow-x: auto;
  flex-shrink: 0;
}
.date-strip::-webkit-scrollbar { display: none; }
.date-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  min-width: 48px;
  border: none;
  background: transparent;
  color: var(--fg-dim);
  font-family: var(--font-body);
  font-size: 0.78rem;
  font-weight: 500;
  transition: all 0.2s;
}
.date-item .day-num {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--fg);
}
.date-item.active {
  background: var(--accent);
  color: #fff;
}
.date-item.active .day-num { color: #fff; }
.date-item.has-data::after {
  content: '';
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--accent);
}
.date-item.active.has-data::after { background: #fff; }

/* Section label */
.section-label {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 16px 4px 10px;
}

/* Mood check-in */
.mood-checkin {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  margin: 0 4px 12px;
}
.mood-checkin h3 {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 16px;
}
.mood-options {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.mood-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 6px;
  border-radius: var(--radius-sm);
  border: 2px solid transparent;
  background: var(--bg-elevated);
  cursor: pointer;
  transition: all 0.25s;
  font-family: var(--font-body);
  color: var(--fg-dim);
  font-size: 0.7rem;
  font-weight: 500;
}
.mood-btn .emoji { font-size: 1.6rem; line-height: 1; }
.mood-btn:hover { background: var(--bg-card-hover); transform: translateY(-2px); }
.mood-btn.selected { border-color: var(--accent); background: var(--accent-glow); color: var(--fg); }

/* Habits */
.habit-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0 4px;
}
.habit-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
  position: relative;
  overflow: hidden;
}
.habit-card:hover { background: var(--bg-card-hover); }
.habit-card.completed { opacity: 0.7; }
.habit-card.completed .habit-check {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}
.habit-check {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 2px solid var(--fg-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.3s;
  font-size: 0.85rem;
}
.habit-icon {
  width: 40px; height: 40px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  flex-shrink: 0;
}
.habit-info { flex: 1; min-width: 0; }
.habit-name { font-weight: 600; font-size: 0.95rem; }
.habit-streak {
  font-size: 0.78rem;
  color: var(--fg-dim);
  margin-top: 2px;
}
.habit-streak span { color: var(--accent); font-weight: 600; }

/* Progress ring */
.progress-section {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 16px 4px;
}
.progress-ring-wrap {
  position: relative;
  width: 90px; height: 90px;
  flex-shrink: 0;
}
.progress-ring-wrap svg { transform: rotate(-90deg); }
.progress-ring-bg { stroke: var(--bg-elevated); }
.progress-ring-fill {
  stroke: var(--accent);
  transition: stroke-dashoffset 0.6s ease;
}
.progress-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.progress-pct {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--accent);
}
.progress-label {
  font-size: 0.65rem;
  color: var(--fg-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.progress-stats { display: flex; flex-direction: column; gap: 8px; }
.stat-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
}
.stat-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
}
.stat-row .val { font-weight: 700; margin-left: auto; }

/* Journal */
.journal-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  margin: 0 4px 12px;
}
.journal-card h3 {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 12px;
}
.journal-prompt {
  font-size: 0.88rem;
  color: var(--fg-dim);
  font-style: italic;
  margin-bottom: 12px;
  line-height: 1.5;
}
.journal-textarea {
  width: 100%;
  min-height: 100px;
  background: var(--bg-elevated);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: 14px;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 0.9rem;
  resize: vertical;
  line-height: 1.6;
  transition: border-color 0.2s;
}
.journal-textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.journal-textarea::placeholder { color: var(--fg-muted); }
.journal-save {
  margin-top: 12px;
  padding: 10px 24px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.88rem;
  cursor: pointer;
  transition: all 0.2s;
}
.journal-save:hover { filter: brightness(1.1); transform: translateY(-1px); }

/* Add habit modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg-card);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 24px;
  width: 100%;
  max-width: 520px;
  transform: translateY(100%);
  transition: transform 0.35s ease;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-handle {
  width: 36px; height: 4px;
  background: var(--fg-muted);
  border-radius: 2px;
  margin: 0 auto 20px;
}
.modal h2 {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 20px;
}
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--fg-dim);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.form-input {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg-elevated);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 0.9rem;
  transition: border-color 0.2s;
}
.form-input:focus { outline: none; border-color: var(--accent); }
.emoji-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.emoji-pick {
  width: 44px; height: 44px;
  border-radius: var(--radius-sm);
  border: 2px solid transparent;
  background: var(--bg-elevated);
  font-size: 1.3rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.emoji-pick:hover { background: var(--bg-card-hover); }
.emoji-pick.selected { border-color: var(--accent); background: var(--accent-glow); }
.color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
.color-pick {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 3px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
}
.color-pick.selected { border-color: var(--fg); transform: scale(1.15); }
.freq-toggle { display: flex; gap: 8px; }
.freq-btn {
  flex: 1;
  padding: 10px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--bg-elevated);
  background: var(--bg-elevated);
  color: var(--fg-dim);
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.freq-btn.selected {
  border-color: var(--accent);
  background: var(--accent-glow);
  color: var(--fg);
}
.btn-primary {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
}
.btn-primary:hover { filter: brightness(1.1); }
.btn-danger {
  width: 100%;
  padding: 12px;
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--danger);
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.88rem;
  cursor: pointer;
  margin-top: 8px;
}

/* Bottom nav */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 520px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: var(--bg-card);
  border-top: 1px solid var(--bg-elevated);
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
  z-index: 50;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 16px;
  border: none;
  background: transparent;
  color: var(--fg-muted);
  font-family: var(--font-body);
  font-size: 0.65rem;
  font-weight: 600;
  cursor: pointer;
  transition: color 0.2s;
  position: relative;
}
.nav-item svg { width: 22px; height: 22px; }
.nav-item.active { color: var(--accent); }
.nav-fab {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  color: #fff;
  font-size: 1.5rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: -24px;
  box-shadow: 0 4px 16px rgba(255,140,66,0.35);
  transition: all 0.2s;
}
.nav-fab:hover { transform: scale(1.08); }

/* Views */
.view { display: none; }
.view.active { display: block; }

/* Insights page */
.insight-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  margin: 0 4px 12px;
}
.insight-card h3 {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 14px;
}
.chart-wrap {
  position: relative;
  width: 100%;
  max-height: 220px;
}
.streak-board {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
  padding: 0 4px;
}
.streak-item {
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  padding: 16px;
  text-align: center;
}
.streak-item .emoji { font-size: 1.5rem; }
.streak-item .name {
  font-size: 0.82rem;
  font-weight: 600;
  margin: 6px 0 4px;
}
.streak-item .streak-num {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--accent);
}
.streak-item .streak-label {
  font-size: 0.7rem;
  color: var(--fg-dim);
}

/* Journal entries list */
.journal-entries { display: flex; flex-direction: column; gap: 10px; padding: 0 4px; }
.entry-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
}
.entry-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.entry-date { font-size: 0.8rem; color: var(--fg-dim); font-weight: 500; }
.entry-mood { font-size: 1.2rem; }
.entry-text {
  font-size: 0.88rem;
  color: var(--fg-dim);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.entry-delete {
  background: none;
  border: none;
  color: var(--fg-muted);
  cursor: pointer;
  font-size: 0.8rem;
  padding: 4px;
}
.entry-delete:hover { color: var(--danger); }

/* Confetti */
.confetti-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 200;
}
.confetti-piece {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 2px;
  animation: confetti-fall 1.2s ease-out forwards;
}
@keyframes confetti-fall {
  0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg) scale(0.3); opacity: 0; }
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--fg-muted);
}
.empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }
.empty-state p { font-size: 0.9rem; line-height: 1.5; }

/* Quote card */
.quote-card {
  background: linear-gradient(135deg, var(--accent), var(--accent-soft));
  border-radius: var(--radius);
  padding: 24px;
  margin: 0 4px 12px;
  color: #fff;
}
.quote-card .quote-text {
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-style: italic;
  line-height: 1.6;
  margin-bottom: 8px;
}
.quote-card .quote-author {
  font-size: 0.78rem;
  opacity: 0.8;
}

/* Settings */
.settings-group {
  padding: 0 4px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.setting-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
}
.setting-label { font-size: 0.9rem; font-weight: 500; }
.toggle {
  width: 46px; height: 26px;
  border-radius: 13px;
  background: var(--bg-elevated);
  border: none;
  cursor: pointer;
  position: relative;
  transition: background 0.3s;
}
.toggle.on { background: var(--accent); }
.toggle::after {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  top: 3px; left: 3px;
  transition: transform 0.3s;
}
.toggle.on::after { transform: translateX(20px); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>

<div id="app">
  <div class="header">
    <div>
      <div class="header-title">Tangerine</div>
      <div class="header-date" id="headerDate"></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="showView('settings')" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </div>

  <div class="main" id="mainContent">
    <!-- TODAY VIEW -->
    <div class="view active" id="view-today">
      <div class="date-strip" id="dateStrip"></div>

      <div class="quote-card" id="quoteCard">

    <!-- JOURNAL VIEW -->
    <div class="view" id="view-journal">

        <textarea class="journal-textarea" id="journalText" placeholder="Write your thoughts..."></textarea>

    <div class="view" id="view-insights">

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          </button>

        <div class="setting-item">

      Insights

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>

<!-- Add/Edit Habit Modal -->
<div class="modal-overlay" id="habitModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="modalTitle">New Habit</h2>
    <div class="form-group">
      <label class="form-label">Name</label>
      <input class="form-input" id="habitNameInput" placeholder="e.g. Morning meditation" maxlength="40">
    </div>
    <div class="form-group">
      <label class="form-label">Icon</label>
      <div class="emoji-picker" id="emojiPicker"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Color</label>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Frequency</label>
      <div class="freq-toggle">
        <button class="freq-btn selected" data-freq="daily" onclick="selectFreq('daily')">Daily</button>
        <button class="freq-btn" data-freq="weekly" onclick="selectFreq('weekly')">Weekly</button>
      </div>
    </div>
    <button class="btn-primary" onclick="saveHabit()">Save Habit</button>
    <button class="btn-danger" id="deleteHabitBtn" style="display:none" onclick="deleteHabit()">Delete Habit</button>
  </div>
</div>
<div class="confetti-container" id="confetti"></div>

<script>
const HABIT_EMOJIS = ['🧘','💪','📖','💧','🏃','🎨','✍️','🍎','😴','🎵','🌱','💊','🧹','📝','🙏','☀️','🚶','🧠','💤','🍳'];
const HABIT_COLORS = ['#FF8C42','#5CD679','#6C8EFF','#FF6B6B','#FFD966','#C78BFA','#FF85B3','#4ECDC4','#F7A072','#95E1D3'];
const JOURNAL_PROMPTS = [
  "What made you smile today?",
  "What's one thing you're grateful for right now?",
  "How did you take care of yourself today?",
  "What's a challenge you faced and how did you handle it?",
  "What would you like to improve tomorrow?",
  "Describe a moment of peace you experienced today.",
  "What's something new you learned recently?",
  "Who made a positive impact on your day?",
  "What are you looking forward to?",
  "How are you feeling right now, and why?",
  "What's a small win you had today?",
  "What boundaries did you set or maintain today?",
  "What would you tell your past self from a week ago?",
  "Describe your ideal tomorrow.",
  "What habit are you most proud of building?"
];
const QUOTES = [
  { text: "Take care of your body. It's the only place you have to live.", author: "Jim Rohn" },
  { text: "Small daily improvements over time lead to stunning results.", author: "Robin Sharma" },
  { text: "The secret of getting ahead is getting started.", author: "Mark Twain" },
  { text: "You don't have to be extreme, just consistent.", author: "Unknown" },
  { text: "Happiness is not something ready made. It comes from your own actions.", author: "Dalai Lama" },
  { text: "What you do every day matters more than what you do once in a while.", author: "Gretchen Rubin" },
  { text: "Progress, not perfection.", author: "Unknown" },
  { text: "Be gentle with yourself, you're doing the best you can.", author: "Unknown" },
];

let state = { habits: [], completions: {}, moods: {}, journals: [], selectedDate: todayStr(), editingHabitId: null, showQuotes: true };

function todayStr() { return new Date().toISOString().split('T')[0]; }
function dateKey(d) { return d.toISOString().split('T')[0]; }

function loadState() {
  try {
    const s = localStorage.getItem('tangerine_state');
    if (s) {
      const parsed = JSON.parse(s);
      state = { ...state, ...parsed, selectedDate: todayStr() };
    }
  } catch(e) {}
  if (!state.habits.length) {
    state.habits = [
      { id: 'h1', name: 'Meditation', icon: '🧘', color: '#C78BFA', freq: 'daily', createdAt: todayStr() },
      { id: 'h2', name: 'Drink Water', icon: '💧', color: '#4ECDC4', freq: 'daily', createdAt: todayStr() },
      { id: 'h3', name: 'Exercise', icon: '💪', color: '#FF6B6B', freq: 'daily', createdAt: todayStr() },
      { id: 'h4', name: 'Read', icon: '📖', color: '#6C8EFF', freq: 'daily', createdAt: todayStr() },
      { id: 'h5', name: 'Journal', icon: '✍️', color: '#FFD966', freq: 'daily', createdAt: todayStr() },
    ];
  }
}

function saveState() {
  try {
    const { selectedDate, editingHabitId, ...rest } = state;
    localStorage.setItem('tangerine_state', JSON.stringify(rest));
  } catch(e) {}
}

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const v = document.getElementById('view-' + name);
  if (v) v.classList.add('active');
  const n = document.querySelector(`.nav-item[data-view="${name}"]`);
  if (n) n.classList.add('active');
  document.getElementById('mainContent').scrollTop = 0;
  if (name === 'insights') renderInsights();
  if (name === 'journal') renderJournal();
}

function renderDateStrip() {
  const strip = document.getElementById('dateStrip');
  strip.innerHTML = '';
  const today = new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  for (let i = -3; i <= 3; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() + i);
    const key = dateKey(d);
    const hasData = (state.completions[key] && Object.keys(state.completions[key]).length) || state.moods[key];
    const btn = document.createElement('button');
    btn.className = 'date-item' + (key === state.selectedDate ? ' active' : '') + (hasData ? ' has-data' : '');
    btn.innerHTML = `<span style="font-size:0.72rem">${days[d.getDay()]}</span><span class="day-num">${d.getDate()}</span>`;
    btn.onclick = () => { state.selectedDate = key; render(); };
    strip.appendChild(btn);
  }
  setTimeout(() => {
    const active = strip.querySelector('.active');
    if (active) active.scrollIntoView({ inline: 'center', behavior: 'smooth' });
  }, 50);
}

function renderHabits() {
  const list = document.getElementById('habitList');
  list.innerHTML = '';
  const dc = state.completions[state.selectedDate] || {};
  state.habits.forEach(h => {
    const done = !!dc[h.id];
    const streak = getStreak(h.id);
    const card = document.createElement('div');
    card.className = 'habit-card' + (done ? ' completed' : '');
    card.innerHTML = `
      <div class="habit-check">${done ? '✓' : ''}</div>
      <div class="habit-icon" style="background:${h.color}22">${h.icon}</div>
      <div class="habit-info">
        <div class="habit-name">${esc(h.name)}</div>
        <div class="habit-streak">${streak > 0 ? `<span>🔥 ${streak}</span> day streak` : h.freq}</div>
      </div>
    `;
    card.onclick = (e) => {
      if (e.detail === 2) { editHabit(h.id); return; }
      toggleHabit(h.id);
    };
    list.appendChild(card);
  });
}

function toggleHabit(id) {
  if (!state.completions[state.selectedDate]) state.completions[state.selectedDate] = {};
  const dc = state.completions[state.selectedDate];
  if (dc[id]) {
    delete dc[id];
  } else {
    dc[id] = true;
    spawnConfetti();
  }
  saveState();
  render();
}

function getStreak(habitId) {
  let streak = 0;
  const d = new Date(state.selectedDate);
  const dc = state.completions[state.selectedDate];
  if (!dc || !dc[habitId]) return 0;
  while (true) {
    const key = dateKey(d);
    if (state.completions[key] && state.completions[key][habitId]) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else break;
  }
  return streak;
}

function renderProgress() {
  const dc = state.completions[state.selectedDate] || {};
  const total = state.habits.length;
  const done = state.habits.filter(h => dc[h.id]).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  const circ = 238.76;
  document.getElementById('progressRing').style.strokeDashoffset = circ - (circ * pct / 100);
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressStats').innerHTML = `
    <div class="stat-row"><div class="stat-dot" style="background:var(--success)"></div> Completed <span class="val">${done}</span></div>
    <div class="stat-row"><div class="stat-dot" style="background:var(--fg-muted)"></div> Remaining <span class="val">${total - done}</span></div>
    <div class="stat-row"><div class="stat-dot" style="background:var(--accent)"></div> Total <span class="val">${total}</span></div>
  `;
}

function selectMood(mood) {
  state.moods[state.selectedDate] = mood;
  saveState();
  document.querySelectorAll('.mood-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.mood === mood);
  });
}

function renderMood() {
  const m = state.moods[state.selectedDate];
  document.querySelectorAll('.mood-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.mood === m);
  });
}

function renderQuote() {
  const card = document.getElementById('quoteCard');
  if (!state.showQuotes) { card.hidden = true; return; }
  card.hidden = false;
  const idx = new Date().getDate() % QUOTES.length;
  document.getElementById('quoteText').textContent = '"' + QUOTES[idx].text + '"';
  document.getElementById('quoteAuthor').textContent = '— ' + QUOTES[idx].author;
}

function renderHeader() {
  const d = new Date(state.selectedDate + 'T12:00:00');
  document.getElementById('headerDate').textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

// Add Habit Modal
function openAddHabit() {
  state.editingHabitId = null;
  document.getElementById('modalTitle').textContent = 'New Habit';
  document.getElementById('habitNameInput').value = '';
  document.getElementById('deleteHabitBtn').style.display = 'none';
  renderEmojiPicker();
  renderColorPicker();
  selectFreq('daily');
  document.getElementById('habitModal').classList.add('open');
}

function editHabit(id) {
  const h = state.habits.find(x => x.id === id);
  if (!h) return;
  state.editingHabitId = id;
  document.getElementById('modalTitle').textContent = 'Edit Habit';
  document.getElementById('habitNameInput').value = h.name;
  document.getElementById('deleteHabitBtn').style.display = 'block';
  renderEmojiPicker(h.icon);
  renderColorPicker(h.color);
  selectFreq(h.freq);
  document.getElementById('habitModal').classList.add('open');
}

function closeModal() { document.getElementById('habitModal').classList.remove('open'); }

document.getElementById('habitModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function renderEmojiPicker(selected) {
  const picker = document.getElementById('emojiPicker');
  picker.innerHTML = '';
  HABIT_EMOJIS.forEach(e => {
    const btn = document.createElement('button');
    btn.className = 'emoji-pick' + (e === (selected || HABIT_EMOJIS[0]) ? ' selected' : '');
    btn.textContent = e;
    btn.onclick = () => {
      picker.querySelectorAll('.emoji-pick').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    picker.appendChild(btn);
  });
}

function renderColorPicker(selected) {
  const picker = document.getElementById('colorPicker');
  picker.innerHTML = '';
  HABIT_COLORS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'color-pick' + (c === (selected || HABIT_COLORS[0]) ? ' selected' : '');
    btn.style.background = c;
    btn.onclick = () => {
      picker.querySelectorAll('.color-pick').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    picker.appendChild(btn);
  });
}

function selectFreq(f) {
  document.querySelectorAll('.freq-btn').forEach(b => b.classList.toggle('selected', b.dataset.freq === f));
}

function saveHabit() {
  const name = document.getElementById('habitNameInput').value.trim();
  if (!name) return;
  const icon = document.querySelector('#emojiPicker .emoji-pick.selected')?.textContent || '🧘';
  const color = document.querySelector('#colorPicker .color-pick.selected')?.style.background || HABIT_COLORS[0];
  const freq = document.querySelector('.freq-btn.selected')?.dataset.freq || 'daily';
  if (state.editingHabitId) {
    const h = state.habits.find(x => x.id === state.editingHabitId);
    if (h) { h.name = name; h.icon = icon; h.color = color; h.freq = freq; }
  } else {
    state.habits.push({ id: 'h' + Date.now(), name, icon, color, freq, createdAt: todayStr() });
  }
  saveState();
  closeModal();
  render();
}

function deleteHabit() {
  if (!state.editingHabitId) return;
  state.habits = state.habits.filter(h => h.id !== state.editingHabitId);
  saveState();
  closeModal();
  render();
}

// Journal
function renderJournal() {
  const idx = new Date().getDate() % JOURNAL_PROMPTS.length;
  document.getElementById('journalPrompt').textContent = JOURNAL_PROMPTS[idx];
  const todayEntry = state.journals.find(j => j.date === state.selectedDate);
  document.getElementById('journalText').value = todayEntry ? todayEntry.text : '';
  const list = document.getElementById('journalEntries');
  list.innerHTML = '';
  const sorted = [...state.journals].sort((a,b) => b.date.localeCompare(a.date));
  if (!sorted.length) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">📝</div><p>No journal entries yet.<br>Start writing your first reflection!</p></div>';
    return;
  }
  sorted.forEach(j => {
    const moodEmoji = { great:'😄', good:'🙂', okay:'😐', bad:'😔', awful:'😢' }[state.moods[j.date]] || '';
    const d = new Date(j.date + 'T12:00:00');
    const card = document.createElement('div');
    card.className = 'entry-card';
    card.innerHTML = `
      <div class="entry-header">
        <span class="entry-date">${d.toLocaleDateString('en-US', { month:'short', day:'numeric' })}</span>
        <span>${moodEmoji}</span>
        <button class="entry-delete" onclick="deleteJournal('${j.date}')">✕</button>
      </div>
      <div class="entry-text">${esc(j.text)}</div>
    `;
    list.appendChild(card);
  });
}

function saveJournal() {
  const text = document.getElementById('journalText').value.trim();
  if (!text) return;
  const idx = state.journals.findIndex(j => j.date === state.selectedDate);
  if (idx >= 0) state.journals[idx].text = text;
  else state.journals.push({ date: state.selectedDate, text });
  saveState();
  renderJournal();
}

function deleteJournal(date) {
  state.journals = state.journals.filter(j => j.date !== date);
  saveState();
  renderJournal();
}

// Insights
let moodChartInst = null, habitChartInst = null;
function renderInsights() {
  renderMoodChart();
  renderHabitChart();
  renderStreaks();
}

function renderMoodChart() {
  const canvas = document.getElementById('moodChart');
  if (moodChartInst) moodChartInst.destroy();
  const labels = [];
  const data = [];
  const moodVal = { great: 5, good: 4, okay: 3, bad: 2, awful: 1 };
  const colors = [];
  const moodColors = { 5: getCSS('--mood-great'), 4: getCSS('--mood-good'), 3: getCSS('--mood-okay'), 2: getCSS('--mood-bad'), 1: getCSS('--mood-awful') };
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = dateKey(d);
    labels.push(d.toLocaleDateString('en-US', { weekday: 'short' }));
    const v = moodVal[state.moods[key]] || 0;
    data.push(v || null);
    colors.push(moodColors[v] || getCSS('--fg-muted'));
  }
  const fg = getCSS('--fg-dim');
  moodChartInst = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: [{ data, borderColor: getCSS('--accent'), backgroundColor: getCSS('--accent-glow'), tension: 0.4, fill: true, pointBackgroundColor: colors, pointRadius: 6, pointHoverRadius: 8 }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 5, ticks: { stepSize: 1, callback: v => ['','😢','😔','😐','🙂','😄'][v] || '', color: fg, font: { size: 14 } }, grid: { color: 'rgba(128,128,128,0.1)' } },
               x: { ticks: { color: fg }, grid: { display: false } } } }
  });
}

function renderHabitChart() {
  const canvas = document.getElementById('habitChart');
  if (habitChartInst) habitChartInst.destroy();
  const labels = [];
  const data = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = dateKey(d);
    labels.push(d.toLocaleDateString('en-US', { weekday: 'short' }));
    const dc = state.completions[key] || {};
    const done = state.habits.filter(h => dc[h.id]).length;
    const pct = state.habits.length ? Math.round(done / state.habits.length * 100) : 0;
    data.push(pct);
  }
  const fg = getCSS('--fg-dim');
  habitChartInst = new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: [{ data, backgroundColor: getCSS('--accent'), borderRadius: 8, barPercentage: 0.5 }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%', color: fg }, grid: { color: 'rgba(128,128,128,0.1)' } },
               x: { ticks: { color: fg }, grid: { display: false } } } }
  });
}

function renderStreaks() {
  const board = document.getElementById('streakBoard');
  board.innerHTML = '';
  if (!state.habits.length) {
    board.innerHTML = '<div class="empty-state"><div class="emoji">🔥</div><p>Complete habits to build streaks!</p></div>';
    return;
  }
  state.habits.forEach(h => {
    const streak = getStreak(h.id);
    const item = document.createElement('div');
    item.className = 'streak-item';
    item.innerHTML = `<div class="emoji">${h.icon}</div><div class="name">${esc(h.name)}</div><div class="streak-num">${streak}</div><div class="streak-label">day streak</div>`;
    board.appendChild(item);
  });
}

// Confetti
function spawnConfetti() {
  const container = document.getElementById('confetti');
  const colors = ['#FF8C42','#5CD679','#6C8EFF','#FF6B6B','#FFD966','#C78BFA'];
  for (let i = 0; i < 24; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (30 + Math.random() * 40) + '%';
    piece.style.top = (20 + Math.random() * 20) + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 0.3) + 's';
    piece.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
    container.appendChild(piece);
  }
  setTimeout(() => { container.innerHTML = ''; }, 1600);
}

// Theme
function toggleDarkMode() {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  document.getElementById('darkToggle').classList.toggle('on', next === 'dark');
  try { localStorage.setItem('tangerine_theme', next); } catch(e) {}
}

function toggleQuotes() {
  state.showQuotes = !state.showQuotes;
  document.getElementById('quoteToggle').classList.toggle('on', state.showQuotes);
  saveState();
  renderQuote();
}

function loadTheme() {
  try {
    const t = localStorage.getItem('tangerine_theme');
    if (t) {
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('darkToggle').classList.toggle('on', t === 'dark');
    } else {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.getElementById('darkToggle').classList.toggle('on', isDark);
    }
  } catch(e) {}
}

function exportData() {
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tangerine-data.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function clearAllData() {
  state = { habits: [], completions: {}, moods: {}, journals: [], selectedDate: todayStr(), editingHabitId: null, showQuotes: true };
  try { localStorage.removeItem('tangerine_state'); } catch(e) {}
  render();
}

function getCSS(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function render() {
  renderHeader();
  renderDateStrip();
  renderQuote();
  renderMood();
  renderHabits();
  renderProgress();
}

loadState();
loadTheme();
document.getElementById('quoteToggle').classList.toggle('on', state.showQuotes);
render();
</script>
